<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Car Rental System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Car Rental System home">
      <span class="brand-mark" aria-hidden="true">CR</span>
      <span>Car Rental System</span>
    </a>
    <nav class="account-nav" aria-label="Account">
      <a href="/search">Find a car</a>
      {% if user %}
        {% if user.role in ['staff', 'manager'] %}<a href="/staff/fleet">Fleet</a>{% endif %}
        <a href="{{ '/staff' if user.role in ['staff', 'manager'] else '/account' }}">My account</a>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="button secondary" type="submit">Sign out</button>
        </form>
      {% else %}
        <a href="/login">Sign in</a>
        <a class="button" href="/register">Create account</a>
      {% endif %}
    </nav>
  </header>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">Car Rental System &middot; CP317B Group 03</footer>
</body>
</html>
